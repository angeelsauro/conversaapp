name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t conversa:ci .
      - name: Validate compose files
        run: docker compose -f deploy/compose.yaml -f deploy/compose.tunnel.yaml config --quiet
        env:
          CONVERSA_DOMAIN: conversa.example.com
          CLOUDFLARE_TUNNEL_TOKEN: dummy-for-validation
      - name: Validate Caddyfile
        run: docker run --rm -e CONVERSA_DOMAIN=conversa.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
